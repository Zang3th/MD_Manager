name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win32
          - os: macos-latest
            platform: darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Require platform visual baselines
        if: ${{ hashFiles(format('tests/e2e/snapshots/{0}/start-help-dark.png', matrix.platform)) == '' || hashFiles(format('tests/e2e/snapshots/{0}/start-help-light.png', matrix.platform)) == '' || hashFiles(format('tests/e2e/snapshots/{0}/board-expanded-backlog-dark.png', matrix.platform)) == '' || hashFiles(format('tests/e2e/snapshots/{0}/board-expanded-backlog-light.png', matrix.platform)) == '' }}
        run: |
          echo "::error::Missing ${{ matrix.platform }} visual baselines. Run the 'Generate visual baselines' workflow, download the 'visual-baselines' artifact, and copy its contents into tests/e2e/snapshots/."
          exit 1
      - run: npm ci
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        run: npx playwright install chromium
      - run: npm run verify
