name: Generate visual baselines

on:
  workflow_dispatch:

jobs:
  generate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win32
          - os: macos-latest
            platform: darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        run: npx playwright install chromium
      - run: npx playwright test tests/e2e/app.spec.js --grep "platform visual baselines" --update-snapshots=all
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ matrix.platform }}
          path: tests/e2e/snapshots/${{ matrix.platform }}
          if-no-files-found: error
