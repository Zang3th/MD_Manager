<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MD_Manager</title>
  <link rel="icon" href="res/Logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script defer src="vendor/Sortable.min.js"></script>
  <script defer src="domain/project.js"></script>
  <script defer src="domain/history.js"></script>
  <script defer src="io/markdown.js"></script>
  <script defer src="io/files.js"></script>
  <script defer src="ui/render.js"></script>
  <script defer src="ui/interactions.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <img class="app-logo" src="res/Logo.svg" alt="MD_Manager logo">
      <div class="header-left">
        <h1 class="project-title" id="projectTitle">MD_Manager</h1>
        <span class="app-version" id="appVersion">v0.0.5</span>
        <div class="history-controls" id="historyControls" hidden>
          <button class="btn save-btn" id="saveFile" type="button">Save</button>
          <button class="btn control-btn" id="undoChange" type="button" disabled>Undo</button>
          <button class="btn control-btn" id="redoChange" type="button" disabled>Redo</button>
        </div>
      </div>
      <div class="project-stats" id="projectStats" aria-label="Project status overview" hidden></div>
      <div class="header-actions">
        <nav class="control-bar" id="viewerControls" aria-label="Viewer controls" hidden>
          <button class="btn control-btn" id="toggleMetadata" type="button" aria-pressed="false">Metadata</button>
          <button class="btn control-btn" id="toggleStats" type="button" aria-pressed="true">Stats</button>
          <button class="btn control-btn" id="toggleGridView" type="button" aria-pressed="false">Grid View</button>
          <button class="btn control-btn" id="toggleBacklog" type="button" aria-pressed="false" disabled>Backlog</button>
        </nav>
        <button class="btn" id="openFile" type="button">Open Markdown</button>
      </div>
    </div>
  </header>
  <main id="content" aria-live="polite"></main>
  <section class="release backlog" id="backlog" aria-label="Backlog" hidden></section>
  <div class="watermark" id="watermark">© 2026 MD_Manager v0.0.5 · Tim Krüger (Zang3th) · <a href="https://github.com/Zang3th" target="_blank" rel="noopener noreferrer">GitHub</a></div>
</body>
</html>
