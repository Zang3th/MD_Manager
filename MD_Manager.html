<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MD_Manager</title>
  <link rel="icon" href="res/Logo.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --border-color: #30363d;
      --text-primary: #f0f6fc;
      --text-secondary: #8b949e;
      --accent: #238636;
      --accent-hover: #2ea043;
      --link: #58a6ff;
      --scrollbar: #484f58;
      --scrollbar-hover: #6e7681;
      --shadow: 0 2px 5px rgba(0, 0, 0, .35);
      --shadow-hover: 0 5px 12px rgba(0, 0, 0, .45);
    }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: .9rem;
      line-height: 1.6;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      flex: 0 0 auto;
      padding: .6rem 1rem;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow);
    }

    .header-content {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: .7rem;
    }

    .project-title { font-size: 1.25rem; font-weight: 600; }
    .app-logo { width: 2rem; height: 2rem; object-fit: contain; }
    .header-actions { display: flex; align-items: center; gap: .5rem; justify-self: end; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      padding: .4rem .65rem;
      border: 1px solid rgba(240, 246, 252, .1);
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: .82rem;
      font-weight: 500;
      cursor: pointer;
      transition: .2s;
    }

    .btn:hover { background: var(--accent-hover); }
    .editable { caret-color: transparent; cursor: default; user-select: none; }
    .editable:focus { outline: none; }
    .editable.editing { outline: 1px solid var(--scrollbar-hover); outline-offset: 2px; caret-color: auto; cursor: text; user-select: text; }
    .editable::selection { background: rgba(110, 118, 129, .45); color: var(--text-primary); }

    .control-bar { display: flex; align-items: center; gap: .35rem; }
    .control-bar[hidden] { display: none; }
    .control-btn { border-color: var(--border-color); background: var(--bg-tertiary); color: var(--text-secondary); }
    .control-btn:hover { background: var(--border-color); color: var(--text-primary); }
    .control-btn[aria-pressed="true"] { background: var(--border-color); color: var(--text-primary); }

    main {
      display: flex;
      flex: 1 1 auto;
      align-items: flex-start;
      gap: .75rem;
      width: 100%;
      min-height: 0;
      padding: .75rem;
      overflow-x: scroll;
      overflow-y: auto;
      scrollbar-color: var(--scrollbar) var(--border-color);
      scrollbar-width: auto;
    }

    main::-webkit-scrollbar { height: 18px; }
    main::-webkit-scrollbar-track { background: var(--border-color); border-radius: 9px; }
    main::-webkit-scrollbar-thumb { background: var(--scrollbar); border: 3px solid var(--border-color); border-radius: 9px; }
    main::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }

    .release {
      flex: 0 0 calc((100% - 3.75rem) / 6);
      min-width: 0;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: var(--bg-tertiary);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: border-color .15s;
    }

    .release-header { padding: .65rem .75rem; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); cursor: pointer; }
    .release-header:focus-visible { outline: 2px solid var(--link); outline-offset: -2px; }

    .release-heading { position: relative; }
    .release-title { padding: 0 3rem; font-size: 1.05rem; font-weight: 600; text-align: center; }
    .release-check { position: absolute; top: 0; left: 0; color: var(--accent-hover); font-size: 1rem; font-weight: 700; caret-color: transparent; user-select: none; }
    .release-version { position: absolute; top: .1rem; right: 0; color: var(--text-secondary); font-size: .82rem; text-align: right; }
    .release-meta { display: none; margin-top: .4rem; padding-top: .35rem; border-top: 1px solid var(--border-color); }
    .show-dates .release-meta { display: block; }
    .release-dates { color: var(--text-secondary); font-size: .78rem; font-weight: 400; list-style: none; text-align: center; }

    .board {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: .75rem;
      padding: .75rem;
    }

    .column {
      width: 100%;
      padding: .65rem;
      border: 1px solid transparent;
      background: var(--bg-secondary);
      border-radius: 8px;
      box-shadow: var(--shadow);
      transition: border-color .15s;
    }

    .column.complete { border-color: var(--accent); }
    .column:has(> .column-header:hover) { border-color: var(--scrollbar-hover); box-shadow: inset 0 0 0 3px var(--scrollbar-hover); }

    .column-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      padding-bottom: .5rem;
      border-bottom: 2px solid var(--border-color);
      cursor: pointer;
    }

    .column-header:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
    .column.collapsed .column-header { padding-bottom: 0; border-bottom: 0; }
    .column.collapsed .card-list { display: none; }

    .column-title { font-size: .95rem; font-weight: 600; }
    .feature-progress { flex: 0 0 auto; color: var(--text-secondary); font-size: .78rem; font-weight: 600; caret-color: transparent; pointer-events: none; user-select: none; }
    .column.complete .feature-progress { color: var(--accent-hover); }

    .card-list { display: grid; gap: .5rem; margin-top: .6rem; }

    .card {
      padding: .65rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-secondary);
      cursor: pointer;
      transition: border-color .15s;
    }

    .card:has(> .card-header:hover) { border-color: var(--scrollbar-hover); box-shadow: inset 0 0 0 3px var(--scrollbar-hover); }
    .card:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
    .card-header { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
    .card-title { font-size: .85rem; font-weight: 600; }
    .task-progress { flex: 0 0 auto; padding: .1rem .35rem; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-tertiary); color: var(--text-secondary); font-size: .72rem; font-weight: 600; caret-color: transparent; pointer-events: none; user-select: none; }
    .card.complete .task-progress { border-color: var(--accent); background: var(--accent); color: #fff; }
    .card-body { color: var(--text-secondary); font-size: .8rem; }
    .card-body:not([hidden]) { margin-top: .55rem; }
    .card-body[hidden] { display: none; }
    .card-body p + p, .card-body ul + p, .card-body p + ul { margin-top: .6rem; }
    .card-body ul { padding-left: 0; list-style: none; }
    .card-body li + li { margin-top: .25rem; }
    .card-body code { padding: .1rem .3rem; border-radius: 3px; background: var(--bg-primary); }
    .card-body a { color: var(--link); }
    .checkbox { display: inline-block; width: 1.15rem; color: var(--text-secondary); cursor: pointer; }
    .checkbox.checked { color: var(--accent-hover); }

    .empty, .error {
      padding: 1.5rem 1rem;
      border-radius: 8px;
      background: var(--bg-secondary);
      color: var(--text-secondary);
      text-align: center;
      box-shadow: var(--shadow);
    }

    main > .empty, main > .error { flex: 1; }
    .start-screen { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
    .recent-files { width: min(32rem, 100%); text-align: center; }
    .recent-files-title { margin-bottom: .4rem; color: var(--text-primary); font-size: .85rem; }
    .recent-files-list { display: grid; gap: .35rem; }
    .recent-file {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .75rem;
      width: 100%;
      padding: .5rem .65rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font: inherit;
      cursor: pointer;
    }
    .recent-file:hover { border-color: var(--text-secondary); background: var(--border-color); }
    .recent-file-name { overflow: hidden; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .recent-file-time { flex: 0 0 auto; color: var(--text-secondary); font-size: .75rem; }
    .recent-files-empty { color: var(--text-secondary); font-size: .8rem; }

    .watermark {
      position: fixed;
      bottom: 22px;
      left: .75rem;
      z-index: 10;
      color: var(--text-secondary);
      font-size: .78rem;
      font-weight: 300;
    }
    .watermark a { color: inherit; text-decoration: none; }
    .watermark a:hover { text-decoration: underline; }

    .toggle-grid-view main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(max(208px, calc((100% - 3.75rem) / 6)), 1fr));
      align-content: start;
      align-items: stretch;
      overflow-x: hidden;
    }

    .toggle-grid-view .release { min-width: 0; }
    .toggle-grid-view .board { gap: .4rem; padding: .5rem; }
    .toggle-grid-view .column { padding: .5rem; }
    .toggle-grid-view .column-header { padding-bottom: 0; border-bottom: 0; }
    .toggle-grid-view main > .empty, .toggle-grid-view main > .error { grid-column: 1 / -1; }

    .error { color: #ef4444; }

    @media (max-width: 700px) {
      .header, main { padding: .6rem; }
      .project-title { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <h1 class="project-title" id="projectTitle">MD_Manager</h1>
      <img class="app-logo" src="res/Logo.svg" alt="MD_Manager logo">
      <div class="header-actions">
        <nav class="control-bar" id="viewerControls" aria-label="Viewer controls" hidden>
          <button class="btn control-btn" id="toggleDates" type="button" aria-pressed="false">Toggle Dates</button>
          <button class="btn control-btn" id="toggleGridView" type="button" aria-pressed="false">Toggle Grid View</button>
        </nav>
        <button class="btn open-label" id="openFile" type="button">Open Markdown</button>
      </div>
    </div>
  </header>

  <main id="content" aria-live="polite">
    <div class="empty start-screen">
      <section class="recent-files" aria-labelledby="recentFilesTitle">
        <h2 class="recent-files-title" id="recentFilesTitle">Recent files</h2>
        <div class="recent-files-list" id="recentFiles"></div>
      </section>
    </div>
  </main>

  <div class="watermark">© 2026 MD_Manager · Tim Krüger (Zang3th) · <a href="https://github.com/Zang3th" target="_blank" rel="noopener noreferrer">GitHub</a></div>

  <script>
    const content = document.getElementById("content");
    const projectTitle = document.getElementById("projectTitle");
    const openFile = document.getElementById("openFile");
    const viewerControls = document.getElementById("viewerControls");
    const toggleDates = document.getElementById("toggleDates");
    const toggleGridView = document.getElementById("toggleGridView");
    let currentFileHandle = null;
    let currentProject = null;
    let writeQueue = Promise.resolve();

    function openRecentDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("MD_Manager", 1);
        request.onupgradeneeded = () => request.result.createObjectStore("recentFiles", { keyPath: "id" });
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function getRecentFiles() {
      const database = await openRecentDatabase();
      const entries = await new Promise((resolve, reject) => {
        const request = database.transaction("recentFiles").objectStore("recentFiles").getAll();
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
      database.close();
      return entries.sort((left, right) => right.openedAt - left.openedAt).slice(0, 5);
    }

    async function rememberRecentFile(fileHandle) {
      const entries = await getRecentFiles();
      let existing = null;
      for (const entry of entries) {
        if (await entry.handle.isSameEntry(fileHandle)) {
          existing = entry;
          break;
        }
      }

      const record = {
        id: existing?.id || `${Date.now()}-${Math.random()}`,
        name: fileHandle.name,
        openedAt: Date.now(),
        handle: fileHandle
      };
      const updatedEntries = entries.filter(entry => entry.id !== record.id).concat(record)
        .sort((left, right) => right.openedAt - left.openedAt);
      const database = await openRecentDatabase();
      await new Promise((resolve, reject) => {
        const transaction = database.transaction("recentFiles", "readwrite");
        const store = transaction.objectStore("recentFiles");
        store.put(record);
        for (const entry of updatedEntries.slice(5)) store.delete(entry.id);
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
      });
      database.close();
    }

    async function renderRecentFiles() {
      const list = document.getElementById("recentFiles");
      if (!list) return;
      const entries = await getRecentFiles();
      if (!document.getElementById("recentFiles")) return;
      list.replaceChildren();
      if (!entries.length) {
        list.innerHTML = '<p class="recent-files-empty">No recent files</p>';
        return;
      }

      for (const entry of entries) {
        const button = document.createElement("button");
        button.className = "recent-file";
        button.type = "button";
        const name = document.createElement("span");
        name.className = "recent-file-name";
        name.textContent = entry.name;
        const time = document.createElement("time");
        time.className = "recent-file-time";
        time.dateTime = new Date(entry.openedAt).toISOString();
        time.textContent = new Date(entry.openedAt).toLocaleString(undefined, { dateStyle: "short", timeStyle: "short" });
        button.append(name, time);
        button.addEventListener("click", async () => {
          try {
            await openMarkdownHandle(entry.handle);
          } catch (error) {
            list.innerHTML = `<p class="recent-files-empty">The file could not be opened: ${escapeHtml(error.message)}</p>`;
          }
        });
        list.append(button);
      }
    }

    function showStartPage() {
      viewerControls.hidden = true;
      content.innerHTML = '<div class="empty start-screen"><section class="recent-files" aria-labelledby="recentFilesTitle"><h2 class="recent-files-title" id="recentFilesTitle">Recent files</h2><div class="recent-files-list" id="recentFiles"></div></section></div>';
      renderRecentFiles();
    }

    function parseProject(markdown) {
      const newline = markdown.includes("\r\n") ? "\r\n" : "\n";
      const lines = markdown.replace(/\r\n?/g, "\n").split("\n");
      const project = { title: "Untitled Project", titleLine: -1, releases: [], sourceLines: lines, newline };
      let release = null;
      let feature = null;
      let card = null;

      for (const [lineIndex, line] of lines.entries()) {
        const heading = line.match(/^(#{1,4})\s+(.+?)\s*#*\s*$/);

        if (heading) {
          const level = heading[1].length;
          const title = heading[2].trim();

          if (level === 1) {
            project.title = title;
            project.titleLine = lineIndex;
          } else if (level === 2) {
            release = { title, titleLine: lineIndex, version: "", versionLine: -1, dates: [], features: [] };
            project.releases.push(release);
            feature = card = null;
          } else if (level === 3 && release) {
            feature = { title, titleLine: lineIndex, cards: [] };
            release.features.push(feature);
            card = null;
          } else if (level === 4 && feature) {
            card = { title, titleLine: lineIndex, lines: [], lineIndices: [] };
            feature.cards.push(card);
          }
          continue;
        }

        const metadata = line.match(/^\s*[-*+]\s+#(.+?):\s+(.+)\s*$/);
        if (metadata && release && !feature) {
          const label = metadata[1].trim();
          const value = metadata[2].trim();
          if (label.toLowerCase() === "version") {
            release.version = value;
            release.versionLine = lineIndex;
          } else {
            const range = value.match(/^(.+?)(?:\s+-\s+(.+))?$/);
            release.dates.push({ label, from: range[1].trim(), to: range[2]?.trim() || "", lineIndex });
          }
          continue;
        }

        if (card) {
          card.lines.push(line);
          card.lineIndices.push(lineIndex);
        }
      }

      for (const item of project.releases) {
        for (const column of item.features) {
          for (const task of column.cards) {
            while (task.lines[0]?.trim() === "") {
              task.lines.shift();
              task.lineIndices.shift();
            }
            while (task.lines.at(-1)?.trim() === "") {
              task.lines.pop();
              task.lineIndices.pop();
            }
          }
        }
      }

      return project;
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;"
      })[character]);
    }

    function inlineMarkdown(value) {
      return escapeHtml(value)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\*([^*]+)\*/g, "<em>$1</em>")
        .replace(/\[([^\]]+)]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    }

    function renderCardBody(lines) {
      if (!lines.length) return "";
      const parts = [];
      let listOpen = false;

      const closeList = () => {
        if (listOpen) parts.push("</ul>");
        listOpen = false;
      };

      for (const rawLine of lines) {
        const listItem = rawLine.match(/^\s*[-*+]\s+(.*)$/);
        if (listItem) {
          if (!listOpen) parts.push("<ul>");
          listOpen = true;
          const checkbox = listItem[1].match(/^\[([ xX])]\s+(.*)$/);
          parts.push(checkbox
            ? `<li><span class="checkbox${checkbox[1].toLowerCase() === "x" ? " checked" : ""}">${checkbox[1].toLowerCase() === "x" ? "☑" : "☐"}</span><span class="todo-text">${inlineMarkdown(checkbox[2])}</span></li>`
            : `<li><span class="checkbox">☐</span><span class="todo-text">${inlineMarkdown(listItem[1])}</span></li>`);
        } else {
          closeList();
          if (rawLine.trim()) parts.push(`<p>${inlineMarkdown(rawLine.trim())}</p>`);
        }
      }
      closeList();
      return parts.join("");
    }

    function getTodoStates(lines) {
      return lines.map(line => line.match(/^\s*[-*+]\s+(?:\[([ xX])]\s+)?/))
        .filter(Boolean)
        .map(todo => todo[1]?.toLowerCase() === "x");
    }

    function captureViewState() {
      return {
        features: [...document.querySelectorAll(".column")].map(column => column.classList.contains("collapsed")),
        tasks: [...document.querySelectorAll(".card")].map(card => card.getAttribute("aria-expanded") === "true")
      };
    }

    function restoreViewState(viewState) {
      if (!viewState) return;

      document.querySelectorAll(".column").forEach((column, index) => {
        const collapsed = viewState.features[index] ?? true;
        column.classList.toggle("collapsed", collapsed);
        column.querySelector(".column-header").setAttribute("aria-expanded", String(!collapsed));
      });

      document.querySelectorAll(".card").forEach((card, index) => {
        const expanded = viewState.tasks[index] ?? false;
        card.setAttribute("aria-expanded", String(expanded));
        card.querySelector(".card-body").hidden = !expanded;
      });

      document.querySelectorAll(".release").forEach(release => {
        const columns = [...release.querySelectorAll(".column")];
        release.querySelector(".release-header").setAttribute(
          "aria-expanded",
          String(columns.some(column => !column.classList.contains("collapsed")))
        );
      });
    }

    function writeProjectFile() {
      if (!currentFileHandle || !currentProject) return Promise.resolve();
      const markdown = currentProject.sourceLines.join(currentProject.newline);
      const fileHandle = currentFileHandle;
      writeQueue = writeQueue.then(async () => {
        const writable = await fileHandle.createWritable();
        await writable.write(markdown);
        await writable.close();
      });
      return writeQueue;
    }

    function makeEditable(element, originalValue, saveValue) {
      if (!currentFileHandle) return;
      let savedValue = originalValue;
      let cancelled = false;
      element.classList.add("editable");
      element.contentEditable = "false";
      element.spellcheck = false;
      element.oncontextmenu = event => {
        event.preventDefault();
        element.contentEditable = "plaintext-only";
        element.focus();
      };
      element.onfocus = () => {
        element.classList.add("editing");
        requestAnimationFrame(() => {
          const selection = window.getSelection();
          const range = document.createRange();
          range.selectNodeContents(element);
          selection.removeAllRanges();
          selection.addRange(range);
        });
      };
      element.onkeydown = event => {
        if (event.key === "Enter") {
          event.preventDefault();
          element.blur();
        } else if (event.key === "Escape") {
          event.preventDefault();
          cancelled = true;
          element.textContent = savedValue;
          element.blur();
        }
      };
      element.onblur = () => {
        element.classList.remove("editing");
        element.contentEditable = "false";
        if (cancelled) {
          cancelled = false;
          return;
        }
        const value = element.textContent.trim();
        if (!value) {
          element.textContent = savedValue;
          return;
        }
        if (value === savedValue) return;
        saveValue(value);
        savedValue = element.textContent.trim();
        writeProjectFile();
      };
    }

    function renderProject(project, viewState = null) {
      currentProject = project;
      viewerControls.hidden = false;
      projectTitle.textContent = project.title;
      document.title = `${project.title} – MD_Manager`;
      makeEditable(projectTitle, project.title, value => {
        project.title = value;
        project.sourceLines[project.titleLine] = `# ${value}`;
        document.title = `${value} – MD_Manager`;
      });

      if (!project.releases.length) {
        content.innerHTML = '<div class="empty">No releases found. At least one level <code>##</code> heading is required.</div>';
        return;
      }

      content.replaceChildren(...project.releases.map(item => {
        const releaseComplete = item.features.length > 0 && item.features.every(columnData => {
          const todos = columnData.cards.flatMap(cardData => getTodoStates(cardData.lines));
          return todos.length > 0 && todos.every(Boolean);
        });
        const section = document.createElement("section");
        section.className = "release";

        const header = document.createElement("header");
        header.className = "release-header";
        header.innerHTML = `<div class="release-heading">${releaseComplete
          ? '<span class="release-check" title="Complete" aria-label="Complete">✓</span>'
          : ""}<h2 class="release-title">${escapeHtml(item.title)}</h2>${item.version
          ? `<p class="release-version">v${escapeHtml(item.version)}</p>`
          : ""}</div>${item.dates.length
          ? `<div class="release-meta"><ul class="release-dates">${item.dates.map(date => `<li>${escapeHtml(date.from)}${date.to ? ` – ${escapeHtml(date.to)}` : ""}</li>`).join("")}</ul></div>`
          : ""}`;

        const releaseTitle = header.querySelector(".release-title");
        makeEditable(releaseTitle, item.title, value => {
          item.title = value;
          project.sourceLines[item.titleLine] = `## ${value}`;
          equalizeReleaseHeaderHeights();
        });

        const releaseVersion = header.querySelector(".release-version");
        if (releaseVersion) {
          makeEditable(releaseVersion, `v${item.version}`, value => {
            item.version = value.replace(/^v/i, "").trim();
            releaseVersion.textContent = `v${item.version}`;
            project.sourceLines[item.versionLine] = `- #Version: ${item.version}`;
          });
        }

        header.querySelectorAll(".release-dates li").forEach((dateElement, index) => {
          const date = item.dates[index];
          const originalValue = `${date.from}${date.to ? ` – ${date.to}` : ""}`;
          makeEditable(dateElement, originalValue, value => {
            const range = value.match(/^(.+?)(?:\s+[–-]\s+(.+))?$/);
            date.from = range[1].trim();
            date.to = range[2]?.trim() || "";
            dateElement.textContent = `${date.from}${date.to ? ` – ${date.to}` : ""}`;
            project.sourceLines[date.lineIndex] = `- #${date.label}: ${date.from}${date.to ? ` - ${date.to}` : ""}`;
            equalizeReleaseHeaderHeights();
          });
        });

        const board = document.createElement("div");
        board.className = "board";
        board.append(...item.features.map(columnData => {
          const column = document.createElement("article");
          column.className = "column collapsed";
          const featureTodos = columnData.cards.flatMap(cardData => getTodoStates(cardData.lines));
          const featureCompleted = featureTodos.filter(Boolean).length;
          const featureProgress = featureTodos.length
            ? Math.round(featureCompleted / featureTodos.length * 100)
            : 0;
          if (featureTodos.length && featureCompleted === featureTodos.length) {
            column.classList.add("complete");
          }
          column.innerHTML = `<header class="column-header"><h3 class="column-title">${escapeHtml(columnData.title)}</h3><span class="feature-progress">${featureProgress}%</span></header>`;
          const columnTitle = column.querySelector(".column-title");
          makeEditable(columnTitle, columnData.title, value => {
            columnData.title = value;
            project.sourceLines[columnData.titleLine] = `### ${value}`;
          });

          const cardList = document.createElement("div");
          cardList.className = "card-list";
          if (!columnData.cards.length) cardList.innerHTML = '<div class="empty">No tasks</div>';

          for (const cardData of columnData.cards) {
            const cardElement = document.createElement("section");
            cardElement.className = "card";
            const todos = getTodoStates(cardData.lines);
            const completedCount = todos.filter(Boolean).length;
            if (todos.length && completedCount === todos.length) {
              cardElement.classList.add("complete");
            }
            cardElement.tabIndex = 0;
            cardElement.setAttribute("aria-expanded", "false");
            cardElement.innerHTML = `<header class="card-header"><h4 class="card-title">${escapeHtml(cardData.title)}</h4><span class="task-progress">${completedCount}/${todos.length}</span></header><div class="card-body" hidden>${renderCardBody(cardData.lines)}</div>`;

            const cardTitle = cardElement.querySelector(".card-title");
            makeEditable(cardTitle, cardData.title, value => {
              cardData.title = value;
              project.sourceLines[cardData.titleLine] = `#### ${value}`;
            });

            const todoLines = cardData.lines.map((line, lineOffset) => ({
              lineOffset,
              match: line.match(/^(\s*[-*+]\s+)(?:\[([ xX])]\s+)?(.*)$/)
            })).filter(item => item.match);
            cardElement.querySelectorAll(".todo-text").forEach((todoElement, index) => {
              const todo = todoLines[index];
              makeEditable(todoElement, todoElement.textContent, value => {
                todo.match[3] = value;
                const checkbox = todo.match[2] === undefined ? "" : `[${todo.match[2]}] `;
                const updatedLine = `${todo.match[1]}${checkbox}${value}`;
                cardData.lines[todo.lineOffset] = updatedLine;
                project.sourceLines[cardData.lineIndices[todo.lineOffset]] = updatedLine;
              });

              const checkboxElement = todoElement.parentElement.querySelector(".checkbox");
              if (checkboxElement) {
                checkboxElement.addEventListener("click", event => {
                  event.stopPropagation();
                  todo.match[2] = todo.match[2]?.toLowerCase() === "x" ? " " : "x";
                  const updatedLine = `${todo.match[1]}[${todo.match[2]}] ${todo.match[3]}`;
                  cardData.lines[todo.lineOffset] = updatedLine;
                  project.sourceLines[cardData.lineIndices[todo.lineOffset]] = updatedLine;
                  const viewState = captureViewState();
                  if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
                  window.getSelection()?.removeAllRanges();
                  writeProjectFile();
                  renderProject(project, viewState);
                });
              }
            });

            const cardBody = cardElement.querySelector(".card-body");
            const toggleCard = () => {
              const expanded = cardElement.getAttribute("aria-expanded") === "true";
              cardElement.setAttribute("aria-expanded", String(!expanded));
              cardBody.hidden = expanded;
            };
            cardElement.addEventListener("click", event => {
              if (!event.target.closest("a, .editing")) toggleCard();
            });
            cardElement.addEventListener("keydown", event => {
              if (!event.target.closest("a, .editing") && (event.key === "Enter" || event.key === " ")) {
                event.preventDefault();
                toggleCard();
              }
            });

            cardList.append(cardElement);
          }

          const columnHeader = column.querySelector(".column-header");
          columnHeader.tabIndex = 0;
          columnHeader.setAttribute("aria-expanded", "false");
          const toggleFeature = () => {
            const collapsed = column.classList.toggle("collapsed");
            columnHeader.setAttribute("aria-expanded", String(!collapsed));
          };
          columnHeader.addEventListener("click", event => {
            if (!event.target.closest(".editing")) toggleFeature();
          });
          columnHeader.addEventListener("keydown", event => {
            if (!event.target.closest(".editing") && (event.key === "Enter" || event.key === " ")) {
              event.preventDefault();
              toggleFeature();
            }
          });

          column.append(cardList);
          return column;
        }));

        if (!item.features.length) board.innerHTML = '<div class="empty">This release does not contain any features yet.</div>';
        if (item.features.length) {
          header.tabIndex = 0;
          header.setAttribute("aria-expanded", "false");
          const toggleRelease = () => {
            const columns = [...board.querySelectorAll(".column")];
            const expand = columns.every(column => column.classList.contains("collapsed"));
            for (const column of columns) {
              column.classList.toggle("collapsed", !expand);
              column.querySelector(".column-header").setAttribute("aria-expanded", String(expand));
            }
            header.setAttribute("aria-expanded", String(expand));
          };
          header.addEventListener("click", event => {
            if (!event.target.closest(".editing")) toggleRelease();
          });
          header.addEventListener("keydown", event => {
            if (!event.target.closest(".editing") && (event.key === "Enter" || event.key === " ")) {
              event.preventDefault();
              toggleRelease();
            }
          });
        }
        section.append(header, board);
        return section;
      }));

      restoreViewState(viewState);
      equalizeReleaseHeaderHeights();
    }

    function equalizeReleaseHeaderHeights() {
      requestAnimationFrame(() => {
        const titles = [...document.querySelectorAll(".release-title")];
        const headers = [...document.querySelectorAll(".release-header")];
        for (const title of titles) title.style.height = "auto";
        for (const header of headers) header.style.height = "auto";
        const titleHeight = Math.max(0, ...titles.map(title => title.offsetHeight));
        for (const title of titles) title.style.height = `${titleHeight}px`;
        const headerHeight = Math.max(0, ...headers.map(header => header.offsetHeight));
        for (const header of headers) header.style.height = `${headerHeight}px`;
      });
    }

    window.addEventListener("resize", equalizeReleaseHeaderHeights);

    toggleDates.addEventListener("click", () => {
      const visible = document.body.classList.toggle("show-dates");
      toggleDates.setAttribute("aria-pressed", String(visible));
      equalizeReleaseHeaderHeights();
    });

    toggleGridView.addEventListener("click", () => {
      const active = document.body.classList.toggle("toggle-grid-view");
      toggleGridView.setAttribute("aria-pressed", String(active));
      if (active) {
        for (const column of document.querySelectorAll(".column")) {
          column.classList.add("collapsed");
          column.querySelector(".column-header").setAttribute("aria-expanded", "false");
        }
        for (const card of document.querySelectorAll(".card")) {
          card.setAttribute("aria-expanded", "false");
          card.querySelector(".card-body").hidden = true;
        }
      }
      equalizeReleaseHeaderHeights();
    });

    async function openMarkdownHandle(fileHandle) {
      const permission = await fileHandle.requestPermission({ mode: "readwrite" });
      if (permission !== "granted") return;
      const file = await fileHandle.getFile();
      currentFileHandle = fileHandle;
      renderProject(parseProject(await file.text()));
      await rememberRecentFile(fileHandle);
    }

    async function loadDefaultFile() {
      try {
        const response = await fetch("Layout.md", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        renderProject(parseProject(await response.text()));
      } catch (error) {
        showStartPage();
      }
    }

    openFile.addEventListener("click", async () => {
      try {
        const [fileHandle] = await window.showOpenFilePicker({
          types: [{ description: "Markdown", accept: { "text/markdown": [".md"] } }],
          multiple: false
        });
        await openMarkdownHandle(fileHandle);
      } catch (error) {
        if (error.name === "AbortError") return;
        content.innerHTML = `<div class="error">The file could not be read: ${escapeHtml(error.message)}</div>`;
      }
    });

    renderRecentFiles();
    loadDefaultFile();
  </script>
</body>
</html>
