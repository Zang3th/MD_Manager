<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MD_Manager</title>
  <link rel="icon" href="res/Logo.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --border-color: #30363d;
      --text-primary: #f0f6fc;
      --text-secondary: #8b949e;
      --accent: #238636;
      --accent-hover: #2ea043;
      --link: #58a6ff;
      --scrollbar: #484f58;
      --scrollbar-hover: #6e7681;
      --shadow: 0 2px 5px rgba(0, 0, 0, .35);
      --shadow-hover: 0 5px 12px rgba(0, 0, 0, .45);
    }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: .9rem;
      line-height: 1.6;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      flex: 0 0 auto;
      padding: .6rem 1rem;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow);
    }

    .header-content {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: .7rem;
    }

    .project-title { font-size: 1.25rem; font-weight: 600; }
    .app-logo { width: 2rem; height: 2rem; object-fit: contain; }
    .header-actions { display: flex; align-items: center; gap: .5rem; justify-self: end; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      padding: .4rem .65rem;
      border: 1px solid rgba(240, 246, 252, .1);
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: .82rem;
      font-weight: 500;
      cursor: pointer;
      transition: .2s;
    }

    .btn:hover { background: var(--accent-hover); }
    .file-input { display: none; }

    .control-bar { display: flex; align-items: center; gap: .35rem; }
    .control-bar[hidden] { display: none; }
    .control-btn { border-color: var(--border-color); background: var(--bg-tertiary); color: var(--text-secondary); }
    .control-btn:hover { background: var(--border-color); color: var(--text-primary); }
    .control-btn[aria-pressed="true"] { background: var(--border-color); color: var(--text-primary); }

    main {
      display: flex;
      flex: 1 1 auto;
      align-items: flex-start;
      gap: .75rem;
      width: 100%;
      min-height: 0;
      padding: .75rem;
      overflow-x: scroll;
      overflow-y: auto;
      scrollbar-color: var(--scrollbar) var(--border-color);
      scrollbar-width: auto;
    }

    main::-webkit-scrollbar { height: 18px; }
    main::-webkit-scrollbar-track { background: var(--border-color); border-radius: 9px; }
    main::-webkit-scrollbar-thumb { background: var(--scrollbar); border: 3px solid var(--border-color); border-radius: 9px; }
    main::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }

    .release {
      flex: 0 0 16%;
      min-width: 208px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: var(--bg-tertiary);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .release-header { padding: .65rem .75rem; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); }

    .release-heading { position: relative; }
    .release-title { padding: 0 3rem; font-size: 1.05rem; font-weight: 600; text-align: center; }
    .release-check { position: absolute; top: 0; left: 0; color: var(--accent-hover); font-size: 1rem; font-weight: 700; }
    .release-version { position: absolute; top: .1rem; right: 0; color: var(--text-secondary); font-size: .82rem; text-align: right; }
    .release-meta { display: none; margin-top: .4rem; padding-top: .35rem; border-top: 1px solid var(--border-color); }
    .show-dates .release-meta { display: block; }
    .release-dates { color: var(--text-secondary); font-size: .78rem; font-weight: 400; list-style: none; text-align: center; }

    .board {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: .75rem;
      padding: .75rem;
    }

    .column {
      width: 100%;
      padding: .65rem;
      border: 1px solid transparent;
      background: var(--bg-secondary);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .column.complete { border-color: var(--accent); }

    .column-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      padding-bottom: .5rem;
      border-bottom: 2px solid var(--border-color);
    }

    .column-title { font-size: .95rem; font-weight: 600; }
    .feature-progress { flex: 0 0 auto; color: var(--text-secondary); font-size: .78rem; font-weight: 600; }
    .column.complete .feature-progress { color: var(--accent-hover); }

    .card-list { display: grid; gap: .5rem; margin-top: .6rem; }

    .card {
      padding: .65rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-secondary);
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }

    .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
    .card:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
    .card-header { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
    .card-title { font-size: .85rem; font-weight: 600; }
    .task-progress { flex: 0 0 auto; padding: .1rem .35rem; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-tertiary); color: var(--text-secondary); font-size: .72rem; font-weight: 600; }
    .card.complete .task-progress { border-color: var(--accent); background: var(--accent); color: #fff; }
    .card-body { color: var(--text-secondary); font-size: .8rem; }
    .card-body:not([hidden]) { margin-top: .55rem; }
    .card-body[hidden] { display: none; }
    .card-body p + p, .card-body ul + p, .card-body p + ul { margin-top: .6rem; }
    .card-body ul { padding-left: 1.2rem; }
    .card-body li + li { margin-top: .25rem; }
    .card-body code { padding: .1rem .3rem; border-radius: 3px; background: var(--bg-primary); }
    .card-body a { color: var(--link); }
    .checkbox { display: inline-block; width: 1.15rem; color: var(--accent); }

    .empty, .error {
      padding: 1.5rem 1rem;
      border-radius: 8px;
      background: var(--bg-secondary);
      color: var(--text-secondary);
      text-align: center;
      box-shadow: var(--shadow);
    }

    main > .empty, main > .error { flex: 1; }
    .start-arrow { font-size: 1.6rem; }

    .collapse-view main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(max(208px, calc((100% - 3.75rem) / 6)), 1fr));
      align-content: start;
      align-items: stretch;
      overflow-x: hidden;
    }

    .collapse-view .release { min-width: 0; height: 100%; }
    .collapse-view .board { gap: .4rem; padding: .5rem; }
    .collapse-view .column { padding: .5rem; }
    .collapse-view .card-list { display: none; }
    .collapse-view main > .empty, .collapse-view main > .error { grid-column: 1 / -1; }

    .error { color: #ef4444; }

    @media (max-width: 700px) {
      .header, main { padding: .6rem; }
      .project-title { font-size: 1rem; }
      .release { flex-basis: 85%; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <h1 class="project-title" id="projectTitle">MD_Manager</h1>
      <img class="app-logo" src="res/Logo.svg" alt="MD_Manager logo">
      <div class="header-actions">
        <nav class="control-bar" id="viewerControls" aria-label="Viewer controls" hidden>
          <button class="btn control-btn" id="toggleDates" type="button" aria-pressed="false">Toggle Dates</button>
          <button class="btn control-btn" id="collapseView" type="button" aria-pressed="false">Collapse View</button>
        </nav>
        <label class="btn open-label" for="fileInput"><span>Open Markdown</span></label>
      </div>
      <input class="file-input" id="fileInput" type="file" accept=".md,text/markdown,text/plain">
    </div>
  </header>

  <main id="content" aria-live="polite">
    <div class="empty"><span class="start-arrow">↗</span><br>Open a Markdown file in the top-right ...</div>
  </main>

  <script>
    const content = document.getElementById("content");
    const projectTitle = document.getElementById("projectTitle");
    const fileInput = document.getElementById("fileInput");
    const viewerControls = document.getElementById("viewerControls");
    const toggleDates = document.getElementById("toggleDates");
    const collapseView = document.getElementById("collapseView");

    function parseProject(markdown) {
      const project = { title: "Untitled Project", releases: [] };
      let release = null;
      let feature = null;
      let card = null;

      for (const line of markdown.replace(/\r\n?/g, "\n").split("\n")) {
        const heading = line.match(/^(#{1,4})\s+(.+?)\s*#*\s*$/);

        if (heading) {
          const level = heading[1].length;
          const title = heading[2].trim();

          if (level === 1) {
            project.title = title;
          } else if (level === 2) {
            release = { title, version: "", dates: [], features: [] };
            project.releases.push(release);
            feature = card = null;
          } else if (level === 3 && release) {
            feature = { title, cards: [] };
            release.features.push(feature);
            card = null;
          } else if (level === 4 && feature) {
            card = { title, lines: [] };
            feature.cards.push(card);
          }
          continue;
        }

        const metadata = line.match(/^\s*[-*+]\s+#(.+?):\s+(.+)\s*$/);
        if (metadata && release && !feature) {
          const label = metadata[1].trim();
          const value = metadata[2].trim();
          if (label.toLowerCase() === "version") {
            release.version = value;
          } else {
            const range = value.match(/^(.+?)(?:\s+-\s+(.+))?$/);
            release.dates.push({ label, from: range[1].trim(), to: range[2]?.trim() || "" });
          }
          continue;
        }

        if (card) card.lines.push(line);
      }

      for (const item of project.releases) {
        for (const column of item.features) {
          for (const task of column.cards) {
            while (task.lines[0]?.trim() === "") task.lines.shift();
            while (task.lines.at(-1)?.trim() === "") task.lines.pop();
          }
        }
      }

      return project;
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;"
      })[character]);
    }

    function inlineMarkdown(value) {
      return escapeHtml(value)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\*([^*]+)\*/g, "<em>$1</em>")
        .replace(/\[([^\]]+)]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    }

    function renderCardBody(lines) {
      if (!lines.length) return "";
      const parts = [];
      let listOpen = false;

      const closeList = () => {
        if (listOpen) parts.push("</ul>");
        listOpen = false;
      };

      for (const rawLine of lines) {
        const listItem = rawLine.match(/^\s*[-*+]\s+(.*)$/);
        if (listItem) {
          if (!listOpen) parts.push("<ul>");
          listOpen = true;
          const checkbox = listItem[1].match(/^\[([ xX])]\s+(.*)$/);
          parts.push(checkbox
            ? `<li><span class="checkbox">${checkbox[1].toLowerCase() === "x" ? "☑" : "☐"}</span>${inlineMarkdown(checkbox[2])}</li>`
            : `<li>${inlineMarkdown(listItem[1])}</li>`);
        } else {
          closeList();
          if (rawLine.trim()) parts.push(`<p>${inlineMarkdown(rawLine.trim())}</p>`);
        }
      }
      closeList();
      return parts.join("");
    }

    function renderProject(project) {
      viewerControls.hidden = false;
      projectTitle.textContent = project.title;
      document.title = `${project.title} – MD_Manager`;

      if (!project.releases.length) {
        content.innerHTML = '<div class="empty">No releases found. At least one level <code>##</code> heading is required.</div>';
        return;
      }

      content.replaceChildren(...project.releases.map(item => {
        const releaseComplete = item.features.length > 0 && item.features.every(columnData => {
          const checkboxes = columnData.cards.flatMap(cardData => cardData.lines
            .map(line => line.match(/^\s*[-*+]\s+\[([ xX])]\s+/))
            .filter(Boolean));
          return checkboxes.length > 0 && checkboxes.every(checkbox => checkbox[1].toLowerCase() === "x");
        });
        const section = document.createElement("section");
        section.className = "release";

        const header = document.createElement("header");
        header.className = "release-header";
        header.innerHTML = `<div class="release-heading">${releaseComplete
          ? '<span class="release-check" title="Complete" aria-label="Complete">✓</span>'
          : ""}<h2 class="release-title">${escapeHtml(item.title)}</h2>${item.version
          ? `<p class="release-version">v${escapeHtml(item.version)}</p>`
          : ""}</div>${item.dates.length
          ? `<div class="release-meta"><ul class="release-dates">${item.dates.map(date => `<li>${escapeHtml(date.from)}${date.to ? ` – ${escapeHtml(date.to)}` : ""}</li>`).join("")}</ul></div>`
          : ""}`;

        const board = document.createElement("div");
        board.className = "board";
        board.append(...item.features.map(columnData => {
          const column = document.createElement("article");
          column.className = "column";
          const featureCheckboxes = columnData.cards.flatMap(cardData => cardData.lines
            .map(line => line.match(/^\s*[-*+]\s+\[([ xX])]\s+/))
            .filter(Boolean));
          const featureCompleted = featureCheckboxes.filter(checkbox => checkbox[1].toLowerCase() === "x").length;
          const featureProgress = featureCheckboxes.length
            ? Math.round(featureCompleted / featureCheckboxes.length * 100)
            : 0;
          if (featureCheckboxes.length && featureCompleted === featureCheckboxes.length) {
            column.classList.add("complete");
          }
          column.innerHTML = `<header class="column-header"><h3 class="column-title">${escapeHtml(columnData.title)}</h3><span class="feature-progress">${featureProgress}%</span></header>`;

          const cardList = document.createElement("div");
          cardList.className = "card-list";
          if (!columnData.cards.length) cardList.innerHTML = '<div class="empty">No tasks</div>';

          for (const cardData of columnData.cards) {
            const cardElement = document.createElement("section");
            cardElement.className = "card";
            const checkboxes = cardData.lines
              .map(line => line.match(/^\s*[-*+]\s+\[([ xX])]\s+/))
              .filter(Boolean);
            const completedCount = checkboxes.filter(checkbox => checkbox[1].toLowerCase() === "x").length;
            if (checkboxes.length && completedCount === checkboxes.length) {
              cardElement.classList.add("complete");
            }
            cardElement.tabIndex = 0;
            cardElement.setAttribute("aria-expanded", "false");
            cardElement.innerHTML = `<header class="card-header"><h4 class="card-title">${escapeHtml(cardData.title)}</h4><span class="task-progress">${completedCount}/${checkboxes.length}</span></header><div class="card-body" hidden>${renderCardBody(cardData.lines)}</div>`;

            const cardBody = cardElement.querySelector(".card-body");
            const toggleCard = () => {
              const expanded = cardElement.getAttribute("aria-expanded") === "true";
              cardElement.setAttribute("aria-expanded", String(!expanded));
              cardBody.hidden = expanded;
            };
            cardElement.addEventListener("click", event => {
              if (!event.target.closest("a")) toggleCard();
            });
            cardElement.addEventListener("keydown", event => {
              if (!event.target.closest("a") && (event.key === "Enter" || event.key === " ")) {
                event.preventDefault();
                toggleCard();
              }
            });

            cardList.append(cardElement);
          }

          column.append(cardList);
          return column;
        }));

        if (!item.features.length) board.innerHTML = '<div class="empty">This release does not contain any features yet.</div>';
        section.append(header, board);
        return section;
      }));

      equalizeReleaseHeaderHeights();
    }

    function equalizeReleaseHeaderHeights() {
      requestAnimationFrame(() => {
        const titles = [...document.querySelectorAll(".release-title")];
        const headers = [...document.querySelectorAll(".release-header")];
        const releases = [...document.querySelectorAll(".release")];
        for (const title of titles) title.style.height = "auto";
        for (const header of headers) header.style.height = "auto";
        for (const release of releases) release.style.height = "auto";
        const titleHeight = Math.max(0, ...titles.map(title => title.offsetHeight));
        for (const title of titles) title.style.height = `${titleHeight}px`;
        const headerHeight = Math.max(0, ...headers.map(header => header.offsetHeight));
        for (const header of headers) header.style.height = `${headerHeight}px`;
        if (document.body.classList.contains("collapse-view")) {
          const releaseHeight = Math.max(0, ...releases.map(release => release.offsetHeight));
          for (const release of releases) release.style.height = `${releaseHeight}px`;
        }
      });
    }

    window.addEventListener("resize", equalizeReleaseHeaderHeights);

    toggleDates.addEventListener("click", () => {
      const visible = document.body.classList.toggle("show-dates");
      toggleDates.setAttribute("aria-pressed", String(visible));
      equalizeReleaseHeaderHeights();
    });

    collapseView.addEventListener("click", () => {
      const active = document.body.classList.toggle("collapse-view");
      collapseView.setAttribute("aria-pressed", String(active));
      if (active) {
        for (const card of document.querySelectorAll(".card")) {
          card.setAttribute("aria-expanded", "false");
          card.querySelector(".card-body").hidden = true;
        }
      }
      equalizeReleaseHeaderHeights();
    });

    async function loadDefaultFile() {
      try {
        const response = await fetch("Layout.md", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        renderProject(parseProject(await response.text()));
      } catch (error) {
        content.innerHTML = '<div class="empty"><span class="start-arrow">↗</span><br>Open a Markdown file in the top-right ...</div>';
      }
    }

    fileInput.addEventListener("change", async event => {
      const file = event.target.files[0];
      if (!file) return;
      try {
        renderProject(parseProject(await file.text()));
      } catch (error) {
        content.innerHTML = `<div class="error">The file could not be read: ${escapeHtml(error.message)}</div>`;
      } finally {
        fileInput.value = "";
      }
    });

    loadDefaultFile();
  </script>
</body>
</html>
