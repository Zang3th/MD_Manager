<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MD_Manager</title>
  <link rel="icon" href="res/Logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script defer src="vendor/Sortable.min.js"></script>
  <script defer src="domain/project.js"></script>
  <script defer src="domain/history.js"></script>
  <script defer src="domain/status.js"></script>
  <script defer src="io/markdown.js"></script>
  <script defer src="io/files.js"></script>
  <script defer src="ui/theme.js"></script>
  <script defer src="ui/layout.js"></script>
  <script defer src="ui/render.js"></script>
  <script defer src="ui/editor.js"></script>
  <script defer src="ui/interactions.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <img class="app-logo" src="res/Logo.svg" alt="MD_Manager logo">
      <div class="header-left">
        <h1 class="project-title" id="projectTitle">MD_Manager</h1>
        <div class="file-controls">
          <button class="btn control-btn" id="openFile" type="button">Open</button>
          <button class="btn save-btn" id="saveFile" type="button" hidden>Save</button>
        </div>
        <div class="history-controls" id="historyControls" hidden>
          <button class="btn control-btn icon-btn" id="undoChange" type="button" aria-label="Undo" title="Undo" disabled><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
          <button class="btn control-btn icon-btn" id="redoChange" type="button" aria-label="Redo" title="Redo" disabled><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5m5 5H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
        </div>
      </div>
      <div class="project-stats" id="projectStats" aria-label="Project status overview" hidden></div>
      <div class="header-actions">
        <nav class="control-bar" id="viewerControls" aria-label="Viewer controls" hidden>
          <button class="btn control-btn backlog-control" id="toggleBacklog" type="button" aria-pressed="false" disabled>Backlog</button>
          <div class="view-menu">
            <button class="btn control-btn" id="toggleViewMenu" type="button" aria-expanded="false" aria-controls="viewOptions">View <span aria-hidden="true">▾</span></button>
            <div class="view-options" id="viewOptions" hidden>
              <button class="view-option" id="toggleMetadata" type="button" aria-pressed="false">Metadata</button>
              <button class="view-option" id="toggleStats" type="button" aria-pressed="true">Statistics</button>
            </div>
          </div>
          <div class="view-mode" role="group" aria-label="View mode">
            <button class="btn control-btn" id="showBoardView" type="button" aria-pressed="true">Board</button>
            <button class="btn control-btn" id="toggleGridView" type="button" aria-pressed="false">Grid</button>
          </div>
        </nav>
      </div>
      <span class="app-version" id="appVersion">v0.0.14</span>
      <button class="btn control-btn icon-btn theme-toggle" id="toggleTheme" type="button" aria-label="Switch to Light Mode" title="Switch to Light Mode"><span aria-hidden="true">☀</span></button>
    </div>
  </header>
  <div class="workspace">
    <main id="content" aria-live="polite"></main>
    <aside class="backlog-pane" aria-label="Backlog area">
      <section class="release backlog" id="backlog" aria-label="Backlog" hidden></section>
    </aside>
  </div>
  <dialog class="task-editor-dialog" id="taskEditor" aria-labelledby="taskEditorLocation">
    <form class="task-editor" id="taskEditorForm" method="dialog">
      <header class="task-editor-header">
        <nav class="task-editor-breadcrumb" aria-label="Task location"><span id="taskEditorProject"></span><span aria-hidden="true">/</span><span id="taskEditorFeature"></span><span aria-hidden="true">/</span><strong id="taskEditorLocation"></strong></nav>
        <button class="task-editor-close" id="closeTaskEditor" type="button" aria-label="Cancel editing" title="Cancel">✕</button>
      </header>
      <div class="task-editor-content">
        <label class="editor-field">
          <span class="editor-label">Title</span>
          <input id="taskEditorTitle" name="title" type="text" required autocomplete="off">
        </label>
        <label class="editor-field editor-field-grow">
          <span class="editor-label-row"><span class="editor-label">Markdown</span><span class="editor-hint">Todos, tags and labels</span></span>
          <textarea id="taskEditorMarkdown" name="markdown" spellcheck="true"></textarea>
        </label>
      </div>
      <footer class="task-editor-footer">
        <span class="task-editor-dirty" id="taskEditorDirty" hidden>Unsaved changes</span>
        <div class="task-editor-actions">
          <button class="btn editor-cancel" id="cancelTaskEditor" type="button">Cancel</button>
          <button class="btn editor-save" id="saveTaskEditor" type="submit">Save</button>
        </div>
      </footer>
    </form>
  </dialog>
  <div class="watermark" id="watermark">© 2026 MD_Manager v0.0.14 · Tim Krüger (Zang3th) · <a href="https://github.com/Zang3th" target="_blank" rel="noopener noreferrer">GitHub</a></div>
</body>
</html>
